# Conda environment for trackver and trackver_mars.
#
# trackver_mars also needs the mars command on the PATH (it is on ECMWF's Atos HPC).
#
#     conda env create -f environment.yml
#     conda activate trackver
#
# mamba and micromamba read the same file and solve faster.

name: trackver

channels:
  - conda-forge

dependencies:
  - python >=3.10

  # reading the ECMWF BUFR tropical cyclone track files (from S3 or MARS)
  # (eccodes, the BUFR decoder underneath, comes in as a dependency)
  - earthkit-data >=1.0     # S3 and file sources, FeatureList
  - pdbufr >=0.13           # used by to_pandas() to flatten BUFR into a dataframe

  # analysis and plotting
  - numpy
  - pandas
  - matplotlib-base >=3.6   # the meteogram uses layout="constrained"
  - cartopy >=0.22          # the track map and its coastlines

  # downloading the IBTrACS observations
  - wget

  # running the notebooks (not needed for the ./trackver and ./trackver_mars commands)
  - jupyterlab
  - ipykernel
